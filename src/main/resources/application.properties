# ---- Database: H2 stored in a file (./data/pharmatrack.mv.db) so data survives restarts ----
spring.datasource.url=jdbc:h2:file:./data/pharmatrack
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# "update" = Hibernate creates the table from the Batch class if missing, and keeps existing data.
spring.jpa.hibernate.ddl-auto=update

# Browser database viewer at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:file:./data/pharmatrack)
spring.h2.console.enabled=true

server.port=8080

# ---- To use MySQL instead: add the mysql-connector-j dependency in pom.xml and replace the datasource lines with: ----
# spring.datasource.url=jdbc:mysql://localhost:3306/pharmatrack
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
